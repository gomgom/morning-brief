# Copy this file to profile.yaml and replace only the values you need.
# Do not put passwords, API keys, OAuth tokens, or other secrets here.

identity:
  display_name: "Your name"
  address_as: "Your preferred form of address"
  language: "auto"
  tone: "conversational, warm, polite, and precise; avoid sounding like a formal report"
  timezone: "Use account timezone"
  delivery_caption: "Your morning brief is ready."

locations:
  home:
    label: "Home"
    query: "City, region, country"
    always_include: true
  commute:
    label: "Work"
    query: "City, region, country"
    include_on: ["MON", "TUE", "WED", "THU", "FRI"]
    skip_on_holidays: true
    skip_when_off_work: true

calendar:
  included_calendars: ["primary"]
  holiday_calendars: []
  home_timezone: "Use identity.timezone"
  work_status:
    # Optional. Infers whether you are on a long break (for example a school
    # vacation) from the most recent keyword event before today.
    enabled: false
    calendar: ""
    lookback_days: 200
    off_period_keywords: ["vacation start"]
    return_keywords: ["return to work"]
    explicit_workday_keywords: ["workday"]
    rule: "If the most recent match is an off-period keyword, the user is off; if it is a return keyword, they are working. An explicit-workday event today means working."

inbox:
  providers: ["connected email"]
  search_everywhere: true
  extra_queries: []
  unanswered_lookback_days: 7
  fallback: "unread mail from the last 2 days"
  not_a_bottleneck: "A group @-mention, team alias, or team review request that anyone on the list could answer."
  attention_rules:
    - "Unanswered direct request"
    - "Deadline or reversible window closing today"
    - "Verified security or billing issue"
  resolved_rules:
    - "Delivery, payment, cancellation, or transfer confirmation"
    - "A thread question that someone else answered"

chat:
  providers: ["connected chat"]
  lookback_days: 2
  reply_rule: "An emoji reaction to the ask counts as a reply."
  prep_search_days: 7

labels:
  # Headings for the two core lists and the calm empty line, in your language.
  # Korean and English have built-in defaults; other languages must set these.
  attention: "Needs attention"
  resolved: "Resolved"
  empty: "Nothing needs you this morning."

topic_log:
  # Optional memory so the tech radar and concept do not repeat. Needs a
  # connector that can append to a page (for example Notion).
  enabled: false
  provider: "Notion"
  page: "morning-brief-topics"
  lists:
    tech_radar: "Tech radar — covered"
    concept: "Concept of the day — covered"
    candidates: "Candidates"
  line_format: "YYYY-MM-DD · topic"
  compress_after: 60
  compress_rule: "Keep the newest entries with dates; reduce older entries to the topic only."

buttons:
  # Buttons render only when the run prompt contains the exact phrase
  # "Include action buttons". Keep this false unless you add that phrase.
  enabled: false
  origin: "https://chatgpt.com/"

sections:
  # Core lists are fixed: Needs attention, then Resolved.
  core: ["Needs attention", "Resolved"]
  # Optional sections render below Resolved, in this order, only when enabled.
  optional:
    - id: "weather"
      enabled: true
      heading: "Weather"
      preferred_sources: ["official national weather service"]
      air_quality_sources: ["official local air-quality service"]
      mention_air_quality_when: "moderate all day or unhealthy at least once"
      mention_uv_when: "strong"
      require_published_precipitation_numbers: true
    - id: "news"
      enabled: true
      heading: "News"
      lookback_hours: 48
      verification: "Use only items whose original source and publication date have been verified. Omit sparse categories instead of padding them."
      categories:
        - name: "AI and technology"
          max_count: 2
        - name: "Economy and finance"
          max_count: 2
        - name: "Domestic"
          max_count: 2
        - name: "World"
          max_count: 2
        - name: "Light conversation"
          max_count: 2
      item_rule: "Include the publication or event date and a meaningful concrete figure when the source provides one. Never invent a number to fill the format."
    - id: "tech_radar"
      enabled: true
      heading: "Tech radar"
      flow_count: "2-3"
      lookback_hours: 72
      extended_lookback_days: 7
      topics: ["AI", "developer tools", "local models", "open weights", "computer science"]
      rule: "Do not list short article summaries. Synthesize two or three currents across several paragraphs: what changed, why it matters, and how the developments connect, constrain, or contradict one another."
    - id: "concept"
      enabled: true
      heading: "Concept of the day"
      rule: "Explain a different computing, AI, or software concept in three to five paragraphs. Start with an analogy, then cover the mechanism, practical meaning, and limitations. Connect it to today's news only when the connection is real."

relationships: []
# Example:
# relationships:
#   - person: "Name"
#     relation: "partner"
#   - person: "Name"
#     relation: "child"
#     birth_date: "YYYY-MM-DD"

automation:
  schedule: "weekdays at 07:00"
  notify_on_success: true
  unattended: true
  source_boundary: "Use connected calendars, email, chat, and task sources read-only. Do not create, modify, send, delete, archive, label, react, or reschedule source data."
  instruction_precedence: "Apply safety, read-only, and fact-verification rules first; then explicit run-specific choices in the current prompt; then this profile; then general SKILL.md defaults. A run-specific prompt overrides only the fields it names."

# Layout, type, colours, and the terrain drawing are fixed in
# scripts/render_brief.py so every run looks the same.
